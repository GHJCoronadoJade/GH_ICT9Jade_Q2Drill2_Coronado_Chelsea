<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Q2 Drill 2 - Contact Us</title>

    <style>
        body {
            background-image: url('https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/a9259b22-04aa-4cb7-900a-c12edeacb745/DSC06837.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }
     
        .logo {
            height: 40px;
            width: auto;
        }

        .content-wrapper {
            flex: 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Uses your original contact-card style to keep the form narrow */
        .contact-card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            padding: 30px;
            width: 100%;
            max-width: 450px;
        }

        .contact-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        footer {
            background-color: #212529;
            color: #ccc;
            text-align: center;
            padding: 15px 0;
            margin-top: auto;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark px-3">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <img src="obmc.logo - Copy.png" alt="obmc logo" class="logo">
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                    <ul class="navbar-nav me-auto mb-2 mb-sm-0 ms-3">
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="about.html">About Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="enroll.html">Enroll</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="contactus.html">Contact Us</a>
                        </li>
                    </ul>
                    
                    <div class="d-flex align-items-center gap-2">
                        <form class="d-flex">
                            <input class="form-control me-2 form-control-sm" type="search" placeholder="Search" aria-label="Search">
                            <button class="btn btn-primary btn-sm" type="submit">Search</button>
                        </form>
                        <a href="https://obmontessori.orangeapps.ph/landing/obmontessori/" target="_blank" class="btn btn-warning btn-sm text-nowrap">My Portal</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="content-wrapper">
        <div class="contact-card">
            <h2>Contact Us</h2>
            <form>
                <div class="mb-3">
                    <label for="fullName" class="form-label small">Full Name</label>
                    <input type="text" class="form-control" id="fullName" placeholder="Enter your full name">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label small">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email">
                </div>
                <div class="mb-3">
                    <label for="subject" class="form-label small">Subject</label>
                    <input type="text" class="form-control" id="subject" placeholder="Enter subject">
                </div>
                <div class="mb-4">
                    <label for="message" class="form-label small">Message</label>
                    <textarea class="form-control" id="message" rows="4" placeholder="Type your message here"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Send Message</button>
            </form>
        </div>
    </div>
       
    <footer>
        <div class="container">
            <small> © 2026 Drill 2| Created by Chelsea Coronado 9-Jade </small>
        </div>
    </footer>
</body>
</html>
